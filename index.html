<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050818">
<title>Mumbo’s World — Enter the universe</title>
<meta name="description" content="Step inside MUMBO’s universe. Explore music, live sets, shows, memories and Mumbo’s Playground.">
<meta property="og:title" content="Mumbo’s World">
<meta property="og:description" content="A little weird. A lot of bass. Step inside MUMBO’s universe.">
<meta property="og:image" content="assets/world-logo.webp">
<link rel="icon" href="assets/hat.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/mumbo.css?v=v2-2">
<link rel="preload" as="image" href="assets/galaxy-v7.webp">
<link rel="preload" as="image" href="assets/dashboard-fitted.webp">
</head>
<body data-scene="galaxy">
<a class="skip" href="#gpsScreen">Skip to the GPS</a>

<main id="scenes">
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- HOME: the bucket hat galaxy -->
  <section id="galaxy" class="scene" aria-label="The bucket hat galaxy">
    <div class="hanging-sign" id="hangingSign"><i></i><i></i><img src="assets/world-logo-clear.webp" alt="Mumbo’s World.TV"></div>
    <div class="hat-area">
      <div class="hat" id="hat">
        <img class="hat-still" src="assets/galaxy-v7.webp" alt="A galaxy of blue and purple stars forming a bucket hat around a glowing central wormhole">
        <canvas id="hatFlow" aria-hidden="true"></canvas>
        <canvas id="hatPull" aria-hidden="true"></canvas>
        <button class="portal" data-go="hub" aria-label="Enter the wormhole">
          <span class="portal-glow" aria-hidden="true"></span>
          <span class="portal-label">ENTER<br>WORMHOLE</span>
        </button>
      </div>
    </div>
    <p class="entry-note">Scroll up to enter · scroll down to return</p>
    <button id="blimp" aria-label="Show news">
      <span class="blimp-inner">
        <span class="exhaust" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <img class="blimp-body" src="assets/show-ship.webp" alt="">
        <img class="propeller" src="assets/propeller.webp" alt="">
        <span class="ticker" aria-hidden="true"><span id="tickerText"></span></span>
        <span class="flyer" id="blimpFlyer"><img alt=""></span>
      </span>
    </button>
  </section>

  <!-- THE UNIVERSE: world map -->
  <section id="hub" class="scene" aria-label="Choose your world" hidden>
    <div class="map" id="map">
      <svg class="lanes" id="lanes" aria-hidden="true"></svg>
      <div class="traffic" id="traffic" aria-hidden="true"></div>
      <button class="sun" id="sun" aria-label="Play with the sun">
        <img class="face neutral" src="assets/sun-neutral.webp" alt="">
        <img class="face laugh" src="assets/sun-laugh.webp" alt="">
        <img class="face angry" src="assets/sun-angry.webp" alt="">
        <span class="sun-eyes" aria-hidden="true"><i></i><i></i></span>
      </button>
      <button class="planet" data-go="music" style="--d:0s"><span class="halo" aria-hidden="true"></span><img src="assets/music-cutout-v3.webp" alt=""></button>
      <button class="planet" data-go="media" style="--d:-3s"><span class="halo" aria-hidden="true"></span><img src="assets/media-cutout-v3.webp" alt=""></button>
      <button class="planet" data-go="events" style="--d:-6s"><span class="halo" aria-hidden="true"></span><img src="assets/event-planet-v4.webp" alt=""></button>
      <button class="planet" data-go="toys" style="--d:-2s"><span class="halo" aria-hidden="true"></span><img src="assets/playground-cutout-v3.webp" alt=""></button>
      <button class="planet moon" data-go="about" id="moonPlanet"><img src="assets/moon.webp" alt=""><span class="moon-sign">Mumbo’s Moon</span></button>
      <div class="map-caption"><h1>Pick your world.</h1></div>
    </div>
  </section>
</main>

<!-- One template builds every world and mini world -->
<template id="worldTemplate">
  <section class="scene world">
    <div class="city-heading">
      <button class="back" data-back>← World map</button>
      <p class="eyebrow"></p>
      <h1 tabindex="-1"></h1>
    </div>
    <button class="sub-up" data-back aria-label="Return to Music Island" hidden>⌃</button>
    <div class="board-area">
      <div class="board">
        <span class="atmosphere" aria-hidden="true"></span>
        <div class="art"><img alt=""></div>
        <div class="life" aria-hidden="true"></div>
        <div class="spots"></div>
      </div>
      <aside class="moon-panel" hidden></aside>
    </div>
    <p class="world-notice" hidden></p>
    <div class="mobile-list" hidden></div>
  </section>
</template>

<nav id="edgeArrows" aria-label="Neighbouring worlds" hidden>
  <button class="edge prev" data-step="-1" aria-label="Previous world">‹</button>
  <button class="edge next" data-step="1" aria-label="Next world">›</button>
</nav>

<canvas id="warp" aria-hidden="true"></canvas>
<canvas id="clouds" aria-hidden="true"></canvas>

<header class="hud">
  <button class="home-mark" data-go="galaxy" aria-label="Return to the galaxy"><img src="assets/world-logo-clear.webp" alt="Mumbo’s World.TV"></button>
  <div class="hud-right">
    <button id="motionToggle" aria-pressed="false">Pause motion</button>
    <button id="menuToggle" aria-expanded="false" aria-controls="menu">Explore <span aria-hidden="true">☰</span></button>
    <button id="contactBtn" data-contact aria-label="Contact Mumbo"><span class="envelope" aria-hidden="true"><i></i></span>CONTACT</button>
  </div>
</header>
<nav id="menu" aria-label="Quick navigation" hidden>
  <button data-go="hub">World map</button>
  <button data-go="music">Music</button>
  <button data-go="events">Event Central</button>
  <button data-go="media">Media &amp; socials</button>
  <button data-go="about">Mumbo’s Moon</button>
  <button data-go="toys">Mumbo’s Playground</button>
  <button data-directory>Browse this world</button>
  <button data-contact>Contact Mumbo</button>
</nav>

<!-- SPACESHIP DASHBOARD -->
<section id="cockpit" aria-label="Spaceship dashboard">
  <div class="dash-art">
    <div class="reel" id="reel">
      <div class="reel-window" id="reelWindow" tabindex="0" role="group" aria-label="GPS world selector. Use up and down arrows to choose a world."><div class="reel-strip" id="reelStrip"></div></div>
      <button class="reel-btn up" id="reelUp" aria-label="Previous world"></button>
      <button class="reel-btn down" id="reelDown" aria-label="Next world"></button>
      <span class="sr-only" id="reelLive" aria-live="polite"></span>
    </div>

    <button id="copilot" class="copilot" aria-label="Play with your digital copilot">
      <svg class="face-screen" id="botFace" viewBox="0 0 32 20" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    </button>
    <span class="bubble" id="copilotSays" role="status" hidden></span>

    <section id="gpsScreen" aria-label="Information screen">
      <div class="gps-top"><button id="gpsOpen" data-directory aria-haspopup="dialog">INFO:</button><span id="gpsMode">EXPLORER</span></div>
      <div id="gpsDetails" aria-live="polite"></div>
      <button id="reelEnter"><span aria-hidden="true">➤</span> <span id="enterLabel">ENTER WORLD</span></button>
    </section>

    <div class="radio-screen" aria-label="Mumbo Radio">
      <strong>MUMBO<br>RADIO</strong>
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="radio-status">Coming soon</span>
    </div>

    <div class="volume">
      <span class="knob-well"><span class="knob" id="knob" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"></span></span>
      <span class="vol-readout"><span class="vol-label">VOL</span><output id="volOut">70</output><span class="vol-meter" id="volMeter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></span>
    </div>
    <span class="lamp l1" aria-hidden="true"></span><span class="lamp l2" aria-hidden="true"></span><span class="lamp l3" aria-hidden="true"></span>
  </div>
</section>

<dialog id="directory" aria-labelledby="directoryTitle">
  <button class="close" id="directoryClose" aria-label="Close">×</button>
  <h2 id="directoryTitle"></h2>
  <div id="directoryBody"></div>
</dialog>

<canvas id="smoke" aria-hidden="true"></canvas>
<img id="cursor" src="assets/cursor.webp" alt="" aria-hidden="true">
<div id="announce" class="sr-only" aria-live="polite"></div>

<script src="js/data.js?v=v2-2"></script>
<script src="js/fx.js?v=v2-2"></script>
<script src="js/extras.js?v=v2-2"></script>
<script src="js/world.js?v=v2-2"></script>
<script src="js/cockpit.js?v=v2-2"></script>
</body>
</html>
